<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitFlow AI - 版本控制網頁設計</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Element Plus JS -->
    <script src="https://unpkg.com/element-plus"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@element-plus/icons-vue"></head>
    <style>
        :root {
            /* 深色模式變數 - 黑曜石與螢光綠 */
            --bg-color: #050505;
            --panel-color: #121212;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --brand-color: #00f5d4; /* 螢光綠 */
            --accent-gold: linear-gradient(to right, #d4af37, #f3e5ab, #d4af37);
            --border-color: #222222;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        html[data-theme='light'] {
            /* 淺色模式變數 - 紙墨風格 */
            --bg-color: #fcfcfc;
            --panel-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #4b5563;
            --brand-color: #006b5e; /* 深墨綠 */
            --accent-gold: linear-gradient(to right, #b8860b, #daa520, #b8860b);
            --border-color: #e5e7eb;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            transition: all 0.3s ease;
            margin: 0;
        }

        /* 金色漸層標題 */
        .gradient-text {
            background: var(--accent-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* 導航列 */
        .navbar {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        html[data-theme='light'] .navbar {
            background: rgba(255, 255, 255, 0.8);
        }

        /* 卡片自定義 */
        .custom-card {
            background-color: var(--panel-color) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            box-shadow: var(--card-shadow) !important;
            color: var(--text-primary) !important;
        }

        /* 按鈕樣式 */
        .btn-primary {
            background: var(--brand-color) !important;
            border: none !important;
            color: #000 !important;
            font-weight: bold !important;
            box-shadow: 0 4px 14px 0 rgba(0, 245, 212, 0.39);
        }
        .btn-outline {
            background: transparent !important;
            border: 1px solid var(--brand-color) !important;
            color: var(--brand-color) !important;
        }

        /* 表格覆寫 */
        .el-table {
            --el-table-bg-color: var(--panel-color);
            --el-table-tr-bg-color: var(--panel-color);
            --el-table-header-bg-color: var(--bg-color);
            --el-table-border-color: var(--border-color);
            --el-table-text-color: var(--text-primary);
        }

        /* 側邊裝飾 */
        .hero-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 400px;
            background: radial-gradient(circle at 50% 0%, rgba(0, 245, 212, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .theme-toggle-btn {
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .theme-toggle-btn:hover {
            background: rgba(128, 128, 128, 0.1);
        }
    </style>
<body>

<div id="app">
    <div class="hero-glow"></div>
    
    <!-- Header -->
    <header class="navbar sticky top-0 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#00f5d4] rounded flex items-center justify-center text-black font-bold">G</div>
            <span class="text-xl font-bold tracking-tighter">GITFLOW<span class="gradient-text">.AI</span></span>
        </div>
        
        <nav class="hidden md:flex gap-8 text-sm font-medium">
            <a href="#" class="hover:text-[#00f5d4] transition-colors">專案列表</a>
            <a href="#" class="hover:text-[#00f5d4] transition-colors">自動化流程</a>
            <a href="#" class="hover:text-[#00f5d4] transition-colors">團隊管理</a>
            <a href="#" class="hover:text-[#00f5d4] transition-colors">文件</a>
        </nav>

        <div class="flex items-center gap-4">
            <div @click="toggleTheme" class="theme-toggle-btn">
                <span v-if="isDark">🌙</span>
                <span v-else>☀️</span>
            </div>
            <el-button class="btn-primary" round>開始佈署</el-button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 relative">
        <!-- Hero Section -->
        <section class="text-center mb-20">
            <div class="inline-block px-4 py-1 rounded-full border border-[#d4af37] text-[#d4af37] text-xs font-bold mb-6 tracking-widest uppercase">
                🚀 2026 AI 驅動開發
            </div>
            <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight">
                掌握版本控制<br/>
                <span class="gradient-text">引領開發革命</span>
            </h1>
            <p class="text-lg text-secondary max-w-2xl mx-auto mb-10" style="color: var(--text-secondary)">
                透過 AI 加速程式碼審核與衝突解決。在極簡的高對比環境中，<br/>
                體驗快 10 倍的 Git 工作流。
            </p>
            <div class="flex justify-center gap-4">
                <el-button size="large" class="btn-primary px-10 py-6 text-lg">
                    <el-icon class="mr-2"><Monitor /></el-icon> 進入儀表板
                </el-button>
                <el-button size="large" class="btn-outline px-10 py-6 text-lg">
                    查看更新日誌
                </el-button>
            </div>
        </section>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <el-card shadow="never" class="custom-card">
                <div class="text-sm text-secondary mb-2" style="color: var(--text-secondary)">活躍存儲庫</div>
                <div class="text-3xl font-bold">128</div>
                <div class="text-xs text-green-500 mt-2">+12% Since last month</div>
            </el-card>
            <el-card shadow="never" class="custom-card">
                <div class="text-sm text-secondary mb-2" style="color: var(--text-secondary)">本週提交次數</div>
                <div class="text-3xl font-bold gradient-text">2,482</div>
                <div class="text-xs text-green-500 mt-2">系統運行穩定</div>
            </el-card>
            <el-card shadow="never" class="custom-card">
                <div class="text-sm text-secondary mb-2" style="color: var(--text-secondary)">待處理 Pull Request</div>
                <div class="text-3xl font-bold">14</div>
                <div class="text-xs text-yellow-500 mt-2">需立即審閱</div>
            </el-card>
        </div>

        <!-- Recent Activity Table -->
        <el-card shadow="never" class="custom-card">
            <template #header>
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold">近期活動日誌</h3>
                    <el-button link type="primary">查看全部</el-button>
                </div>
            </template>
            <el-table :data="tableData" style="width: 100%">
                <el-table-column prop="repo" label="存儲庫" width="220">
                    <template #default="scope">
                        <span class="font-bold text-[#00f5d4]">/{{ scope.row.repo }}</span>
                    </template>
                </el-table-column>
                <el-table-column prop="commit" label="提交訊息" />
                <el-table-column prop="user" label="開發者" width="150">
                    <template #default="scope">
                        <div class="flex items-center gap-2">
                            <el-avatar :size="24" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"></el-avatar>
                            <span class="text-xs">{{ scope.row.user }}</span>
                        </div>
                    </template>
                </el-table-column>
                <el-table-column prop="status" label="狀態" width="120">
                    <template #default="scope">
                        <el-tag :type="scope.row.status === 'Success' ? 'success' : 'warning'" size="small" effect="dark">
                            {{ scope.row.status }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="time" label="時間" width="150" />
            </el-table>
        </el-card>
    </main>

    <footer class="py-20 text-center border-t border-[#222222]" style="border-color: var(--border-color)">
        <p class="text-secondary text-sm" style="color: var(--text-secondary)">
            © 2026 GitFlow AI. 所有權利保留。由 Vue 3 與 Element Plus 驅動。
        </p>
    </footer>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const isDark = ref(true);
            const tableData = [
                { repo: 'frontend-core', commit: 'feat: add ai reviewer engine', user: 'Alex W.', status: 'Success', time: '2 mins ago' },
                { repo: 'backend-api', commit: 'fix: resolved race condition in auth', user: 'Sarah L.', status: 'Success', time: '1 hour ago' },
                { repo: 'design-system', commit: 'style: high contrast theme tokens', user: 'Kevin K.', status: 'Warning', time: '3 hours ago' },
                { repo: 'gitflow-cli', commit: 'refactor: simplify push command', user: 'Alex W.', status: 'Success', time: 'Yesterday' },
            ];

            const toggleTheme = () => {
                isDark.value = !isDark.value;
                document.documentElement.setAttribute('data-theme', isDark.value ? 'dark' : 'light');
            };

            onMounted(() => {
                // 初始化主題
                document.documentElement.setAttribute('data-theme', 'dark');
            });

            return {
                isDark,
                toggleTheme,
                tableData
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
